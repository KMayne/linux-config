# Software to install. Edit a list, run `chezmoi apply`, and only the install
# scripts whose list changed rerun.

packages:
  # Headlamp (Kubernetes UI) is an AppImage from its GitHub release, installed by
  # run_onchange_after_35-headlamp. Bump this to update. Not the Flathub build: its aws
  # wrapper drops AWS_PROFILE, so EKS auth fails.
  headlamp: "0.46.0"

  fedora:
    # VS Code, Chrome and Tailscale repos are added in .chezmoiscripts/run_onchange_before_10-fedora-repos
    copr:
      - jdxcode/mise
    dnf:
      - git
      - zsh
      - vim-enhanced
      - gh
      - chezmoi
      - ShellCheck
      - gcc                # C linker for Rust crates
      - fira-code-fonts    # Konsole profiles
      - mise
      - code
      - podman-compose     # pulls in podman
      - tailscale          # service started by run_once_after_60-tailscale
    # Only on x86_64: no arm64 RPMs from these vendors (matters for Asahi)
    dnf_x86_64:
      - google-chrome-stable
    # Only on KDE
    dnf_kde:
      - ksshaskpass        # SSH passphrase prompt, saved in KWallet
      - pam-kwallet        # unlocks KWallet with the login password
      # Qt/KF6 dev packages to build ror (run-or-raise, github.com/KMayne/ror)
      - cmake
      - qt6-qtbase-devel
      - qt6-qtdeclarative-devel
      - kf6-kirigami
      - kf6-kdeclarative
    # Only on ASUS laptops, from the Terra repo (asus-linux.org/guides/fedora-guide).
    # GPU switching is in asusctl now; supergfxctl is deprecated.
    dnf_asus:
      - asusctl            # power profiles, fans, charge limit, dGPU on/off
      - asusctl-rog-gui    # ROG Control Center
    flatpak:
      - com.getpostman.Postman
      - com.spotify.Client

  ubuntu:
    apt:
      - zsh
      - vim
      - tmux
      - git
      - gh
      - curl
      - jq
      - python3            # wakatime-cli installer
      - build-essential    # C linker for Rust crates
      - shellcheck
