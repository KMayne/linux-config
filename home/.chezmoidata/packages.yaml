# Software to install. Edit a list, run `chezmoi apply`, and only the install
# scripts whose list changed rerun.

packages:
  fedora:
    # VS Code and Chrome repos are added in .chezmoiscripts/run_onchange_before_10-fedora-repos
    copr:
      - jdxcode/mise
    dnf:
      - git
      - zsh
      - vim-enhanced
      - gh
      - chezmoi
      - ShellCheck
      - gcc                # C linker for Rust crates
      - fira-code-fonts    # Konsole profiles
      - mise
      - code
    # Only on x86_64: no arm64 RPMs from these vendors (matters for Asahi)
    dnf_x86_64:
      - google-chrome-stable
    # Only on KDE: Qt/KF6 dev packages to build ror (run-or-raise, github.com/KMayne/ror)
    dnf_kde:
      - cmake
      - qt6-qtbase-devel
      - qt6-qtdeclarative-devel
      - kf6-kirigami
      - kf6-kdeclarative
    flatpak:
      - com.getpostman.Postman
      - com.spotify.Client
      - io.kinvolk.Headlamp   # Kubernetes UI

  ubuntu:
    apt:
      - zsh
      - vim
      - tmux
      - git
      - gh
      - curl
      - jq
      - python3            # wakatime-cli installer
      - build-essential    # C linker for Rust crates
      - shellcheck
