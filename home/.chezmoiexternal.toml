# Third-party code chezmoi downloads and keeps up to date (replaces the old git submodules).
# `chezmoi apply` refreshes each one at most once per refreshPeriod; `chezmoi apply -R` forces it.

# Not `exact`, so Oh My Zsh's own cache/ and log/ dirs survive refreshes
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/refs/heads/master.tar.gz"
    stripComponents = 1
    refreshPeriod = "168h"

[".config/zsh/omz-custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".config/zsh/omz-custom/plugins/wakatime"]
    type = "archive"
    url = "https://github.com/sobolevn/wakatime-zsh-plugin/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".config/zsh/omz-custom/plugins/zsh-prompt-benchmark"]
    type = "archive"
    url = "https://github.com/romkatv/zsh-prompt-benchmark/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# Vim plugins go straight into Vundle's bundle dir, so no :PluginInstall step is needed.
[".vim/bundle/Vundle.vim"]
    type = "archive"
    url = "https://github.com/VundleVim/Vundle.vim/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".vim/bundle/vim-colors-solarized"]
    type = "archive"
    url = "https://github.com/altercation/vim-colors-solarized/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".vim/bundle/vim-surround"]
    type = "archive"
    url = "https://github.com/tpope/vim-surround/archive/refs/heads/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
